name: release

# Manual only — publishing is a deliberate maintainer decision.
# Flow: tag vX.Y.Z → run this workflow → build → GitHub Release.
#
# PyPI publishing lives in publish-pypi.yml (Trusted Publishing OIDC —
# no long-lived API token, PEP 740 attestations), same pattern as the
# other Forge repos.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install "poetry>=2.2"

      - name: Install and verify
        run: |
          poetry install --no-interaction
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            poetry run python tools/verify_release.py --tag "${GITHUB_REF_NAME}"
          else
            poetry run python tools/verify_release.py
          fi
          poetry run pytest
          poetry build
          poetry run python tools/verify_release.py --dist dist
          python -m pip install --no-deps dist/*.whl
          forge-doctor-data doctor .
          # Full release-candidate artifact set: SBOM, SHA256SUMS,
          # published schemas, release manifest, provenance, env manifest.
          poetry run python tools/release_candidate.py --no-build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/*

      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true


