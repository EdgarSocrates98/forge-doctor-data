name: ci

on:
  push:
    branches: [main]
  pull_request:

# Bootstrap order (deterministic, no circular dependency):
#   setup-python  →  install Poetry  →  manual .venv cache  →  poetry install
# setup-python's `cache: poetry` shells out to the poetry binary during cache
# resolution, so it can only run AFTER Poetry exists. We keep Poetry pinned to
# a major range matching requires-poetry and cache the in-project venv keyed on
# the lockfile hash instead.

jobs:
  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install "poetry>=2.2,<3"

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock', 'pyproject.toml') }}
          restore-keys: venv-${{ runner.os }}-py3.12-

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Environment manifest
        run: python tools/env_manifest.py --output env-manifest.json

      - name: Ruff
        run: poetry run ruff check .

      - name: Format
        run: poetry run ruff format --check .

      - name: Type check
        run: poetry run mypy

  unit-tests:
    name: unit-tests-${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install "poetry>=2.2,<3"

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock', 'pyproject.toml') }}
          restore-keys: venv-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Environment manifest
        run: python tools/env_manifest.py

      - name: Tests
        run: poetry run pytest --cov --cov-report=term-missing

  package-build:
    name: package-build
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install "poetry>=2.2,<3"

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock', 'pyproject.toml') }}
          restore-keys: venv-${{ runner.os }}-py3.12-

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Environment manifest
        run: python tools/env_manifest.py --output env-manifest.json

      - name: Build package
        run: poetry build

      - name: Inspect artifacts
        run: |
          poetry run python tools/verify_release.py --dist dist
          poetry run python -m pip install --no-deps dist/*.whl
          forge-doctor-data --version
          forge-doctor-data schema contracts >/dev/null

      - name: Upload environment manifest
        uses: actions/upload-artifact@v4
        with:
          name: env-manifest
          path: env-manifest.json
          if-no-files-found: error

  smoke:
    name: platform-smoke-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        shell: bash
        run: pipx install "poetry>=2.2,<3"

      - name: Build wheel
        shell: bash
        run: poetry build --format wheel

      - name: Install wheel
        shell: bash
        run: python -m pip install dist/forge_doctor_data-*.whl

      # Wheel-first smoke: critical commands must work in a clean install.
      - name: CLI smoke
        shell: bash
        run: |
          forge-doctor-data --version
          forge-doctor-data doctor .
          forge-doctor-data scan tests/sample_projects/clean_python_project \
            --format json --show-root -o smoke-report.json || test $? -le 1
          python -c "import json,sys; d=json.load(open('smoke-report.json')); assert d['schema_version']=='3.0'; assert d['tool']['name']=='forge-doctor-data'; assert set(d['summary'])>={'passed','info','warnings','errors'}; assert isinstance(d['project']['name'],str); print('smoke ok:', len(d['results']), 'results')"
          forge-doctor-data schema contracts
          forge-doctor-data schema contracts scan-report | python -c "import json,sys; s=json.load(sys.stdin); assert 'results' in s['required']"
          forge-doctor-data explain SPARK001 >/dev/null
          forge-doctor-data checks >/dev/null
          forge-doctor-data lab run
          forge-doctor-data golden run
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}\n' | forge-doctor-data mcp --root . | head -1 | grep -q '"protocolVersion"'

  extras-smoke:
    name: extras smoke (watch/lsp/schemas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with optional extras
        run: pip install '.[watch,lsp,schemas]'

      - name: Boot optional integrations
        run: |
          python -c "import watchfiles, yaml; from pygls.lsp.server import LanguageServer; LanguageServer('fd','1'); yaml.safe_load('a: 1'); print('extras ok')"
          forge-doctor-data --version
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05"}}\n' | forge-doctor-data mcp --root . | head -1

  dogfood:
    name: dogfood (this repo, local action)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # SARIF disabled: the action installs its own checkout ($GITHUB_ACTION_PATH).
      - name: Forge Doctor Data on forge-doctor-data
        uses: ./
        with:
          path: .
          sarif-file: ""
          fail-on: error

  forge-gates:
    name: forge-gates
    needs: [static-analysis, unit-tests, package-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install "poetry>=2.2,<3"

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock', 'pyproject.toml') }}
          restore-keys: venv-${{ runner.os }}-py3.12-

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction

      - name: Environment manifest
        run: python tools/env_manifest.py

      - name: Contract conformance
        run: poetry run forge-doctor-data schema contracts

      - name: forge-contracts/1 conformance (bundled fixtures)
        run: poetry run forge-doctor-data contracts conformance --fixtures

      - name: Public API surface freeze
        run: python tools/api_surface.py --check

      - name: Doc drift (generated project status)
        run: poetry run forge-doctor-data project status --check

      - name: Knowledge conformance
        run: poetry run forge-doctor-data knowledge test

      - name: Forge Lab
        run: poetry run forge-doctor-data lab run

      - name: Golden regression
        run: poetry run forge-doctor-data golden run
